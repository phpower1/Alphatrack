<!doctype html>
<!-- The inline colours below must stay in sync with --surface-0 / --foreground in
     src/index.css. They paint the first frame before the stylesheet loads; when
     they disagreed (#0d0e12 here vs #09090b in CSS) the page flashed on load. -->
<html lang="en" class="dark" style="background-color: #0a0b0f; color: #fafafa;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Alphatrack — Options &amp; Strategy Intelligence</title>
    <meta name="description" content="Alphatrack — Advanced options &amp; equity portfolio intelligence and strategy performance tracker." />
    
    <!-- Open Graph / Facebook / Discord / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alphatrack" />
    <meta property="og:title" content="Alphatrack — Options &amp; Strategy Intelligence" />
    <meta property="og:description" content="Real-time multi-leg strategy tracking, annualized ROI analytics, and trade performance cards." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alphatrack Trade &amp; Strategy Analytics" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alphatrack — Options &amp; Strategy Intelligence" />
    <meta name="twitter:description" content="Real-time multi-leg strategy tracking, annualized ROI analytics, and trade performance cards." />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      // Automatically unregister any stale service workers from previous projects or deployments on localhost
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(function() {});
      }
    </script>
  </head>
  <body style="background-color: #0a0b0f; color: #fafafa; margin: 0; min-height: 100vh;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
